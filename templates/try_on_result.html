<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Your Virtual Try-On Result - Prodex</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans p-4">

    <main class="bg-white p-8 rounded-2xl shadow-2xl max-w-2xl w-full text-center">
        <h1 class="text-4xl font-extrabold text-blue-700 mb-2">Virtual Try-On Result 👗</h1>
        <p class="text-gray-600 mb-8">See how the product looks on you!</p>

        <div class="content">
            {% if generated_image_url %}
                <div class="bg-gray-200 rounded-xl overflow-hidden mb-8 border-4 border-gray-300 shadow-xl">
                    <img src="{{ generated_image_url }}"
                         alt="Generated virtual try-on image"
                         class="w-full h-auto object-contain result-image"
                         id="resultImage"
                         onerror="handleImageError()">
                </div>

                <div class="actions flex justify-center gap-4 flex-wrap">
                    <a href="/" class="bg-indigo-600 text-white px-8 py-3 rounded-full hover:bg-indigo-700 font-semibold transition flex items-center justify-center shadow-lg transform hover:scale-105">
                        <i class="fas fa-arrow-left mr-2"></i> Back to Search
                    </a>
                    <a href="{{ generated_image_url }}" download="prodex-tryon-result.png"
                       class="bg-green-500 text-white px-8 py-3 rounded-full hover:bg-green-600 font-semibold transition flex items-center justify-center shadow-lg transform hover:scale-105">
                        <i class="fas fa-download mr-2"></i> Download Image
                    </a>
                </div>
            {% else %}
                <div class="error bg-red-100 text-red-700 p-6 rounded-xl border border-red-300 mb-8">
                    <h3 class="text-xl font-bold mb-2">❌ No Result Available</h3>
                    <p>The try-on result could not be generated. Please try again.</p>
                </div>
                <div class="actions flex justify-center">
                    <a href="/" class="bg-indigo-600 text-white px-8 py-3 rounded-full hover:bg-indigo-700 font-semibold transition flex items-center justify-center shadow-lg">
                        <i class="fas fa-arrow-left mr-2"></i> Back to Search
                    </a>
                </div>
            {% endif %}
        </div>
    </main>

    <script>
        function handleImageError() {
            const contentDiv = document.querySelector('.content');
            contentDiv.innerHTML = `
                <div class="error bg-yellow-100 text-yellow-700 p-6 rounded-xl border border-yellow-300 mb-8">
                    <h3 class="text-xl font-bold mb-2">⏳ Processing Still in Progress</h3>
                    <p>The AI is still generating your try-on result. This can take 30-60 seconds.</p>
                    <p class="mt-2">Please refresh this page in a few moments.</p>
                </div>
                <div class="actions flex justify-center gap-4 flex-wrap">
                    <button onclick="location.reload()" class="bg-blue-600 text-white px-8 py-3 rounded-full hover:bg-blue-700 font-semibold transition flex items-center justify-center shadow-lg transform hover:scale-105">
                        <i class="fas fa-sync-alt mr-2"></i> Refresh Page
                    </button>
                    <a href="/" class="bg-gray-500 text-white px-8 py-3 rounded-full hover:bg-gray-600 font-semibold transition flex items-center justify-center shadow-lg transform hover:scale-105">
                        <i class="fas fa-arrow-left mr-2"></i> Back to Search
                    </a>
                </div>
            `;
        }
    </script>

</body>
</html>
